<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        window.addEventListener(
          'error',
          (event) => {
            const target = event.target
            if (!(target instanceof HTMLLinkElement && target.rel === 'stylesheet')) return
            if (window.sessionStorage.getItem('friday-elite-css-reload') === '1') return
            window.sessionStorage.setItem('friday-elite-css-reload', '1')
            const url = new URL(window.location.href)
            url.searchParams.set('v', String(Date.now()))
            window.location.replace(url.href)
          },
          true,
        )
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#04100b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="فرايدي إيليت" />
    <meta
      name="description"
      content="فرايدي إيليت — إدارة مباريات كرة القدم الأسبوعية للهواة"
    />
    <title>فرايدي إيليت | Friday Elite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
